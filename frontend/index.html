<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LMS Administración y Gestión</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0}.top{background:#10233f;color:white;padding:22px 7vw}.top h1{margin:0;font-size:clamp(1.3rem,3vw,2rem)}
    .top p{margin:.4rem 0 0;color:#cbd6e5}.wrap{max-width:1180px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #dfe6ef;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(34,55,85,.07)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.badge{display:inline-block;border-radius:999px;background:#e8f0ff;color:#214a8b;padding:6px 10px;font-size:.82rem;font-weight:700}
    h2{margin-top:10px}.muted{color:#64748b}.module{padding:18px;border:1px solid #e3e8f0;border-radius:14px}.error{background:#fff3f3;border-color:#ffd0d0;color:#8c2424}.btn{display:inline-block;margin-top:12px;border-radius:10px;background:#18508f;color:#fff;padding:10px 14px;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <header class="top">
    <h1>LMS Administración y Gestión</h1>
    <p>Motor modular · SCORM · evaluación · integración CAMPUS mediante LTI 1.3 Advantage</p>
  </header>
  <main class="wrap">
    <section id="session" class="card">
      <span class="badge">Fase inicial</span>
      <h2>Acceso</h2>
      <p class="muted">En producción, alumnado y profesorado accederán desde CAMPUS. Si has llegado desde un lanzamiento LTI válido, aquí aparecerá tu curso.</p>
      <div id="who"></div>
    </section>
    <section style="height:18px"></section>
    <section class="card">
      <h2>Catálogo disponible</h2>
      <div id="modules" class="grid"></div>
    </section>
  </main>
<script>
(async()=>{
  const who=document.querySelector("#who");
  const modules=document.querySelector("#modules");
  try{
    const me=await fetch("/api/me",{credentials:"include"});
    if(!me.ok) throw new Error("Sin sesión LTI");
    const d=await me.json();
    who.innerHTML="<strong>"+escapeHtml(d.user.display_name)+"</strong><br><span class='muted'>"+escapeHtml(d.role||"")+" · "+escapeHtml(d.course?.title||"Sin curso")+"</span>"+((d.role==="teacher"||d.role==="admin")?"<br><a class='btn' href='/teacher.html'>Abrir panel docente</a>":"");
    const m=await fetch("/api/modules",{credentials:"include"}).then(r=>r.json());
    if(!m.length){
      modules.innerHTML="<p class='muted'>Aún no hay módulos publicados.</p>";
    }else{
      const cards=await Promise.all(m.map(async x=>{
        let scorms=[];
        if(x.course_module_id){
          try{scorms=await fetch("/api/modules/"+x.id+"/scorm-packages",{credentials:"include"}).then(r=>r.ok?r.json():[])}catch(e){}
        }
        const launch=scorms.length&&x.course_module_id
          ? "<div>"+scorms.map(p=>"<button class='btn' onclick='launchScorm("+Number(x.course_module_id)+","+Number(p.id)+",this)'>Abrir "+escapeHtml(p.title)+"</button>").join(" ")+"</div>"
          : "";
        const evaluation=x.course_module_id
          ? "<a class='btn' href='/evaluation-student.html?course_module="+Number(x.course_module_id)+"'>Actividades y evaluación</a>"
          : "";
        return "<article class='module'><strong>"+escapeHtml(x.title)+"</strong><div class='muted'>"+escapeHtml(x.code||"")+" · "+escapeHtml(x.version)+"</div><p>"+escapeHtml(x.description||"")+"</p>"+launch+evaluation+"</article>";
      }));
      modules.innerHTML=cards.join("");
    }
  }catch(e){
    who.innerHTML="<div class='module error'>No hay una sesión de CAMPUS activa. Este acceso directo solo se usa para comprobar que el LMS está desplegado.</div>";
    modules.innerHTML="<p class='muted'>El catálogo se mostrará después del acceso desde CAMPUS.</p>";
  }
})();
async function launchScorm(courseModuleId,packageId,button){
  const old=button.textContent;button.disabled=true;button.textContent="Abriendo…";
  try{
    const r=await fetch("/api/course-modules/"+courseModuleId+"/scorm/"+packageId+"/launch",{method:"POST",credentials:"include"});
    const d=await r.json();if(!r.ok)throw new Error(d.detail||"No se pudo abrir el SCORM");
    location.href=d.url;
  }catch(e){alert(e.message);button.disabled=false;button.textContent=old}
}
function escapeHtml(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
</script>
</body>
</html>
