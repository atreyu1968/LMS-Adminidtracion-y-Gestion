<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso · LMS Administración y Gestión</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#eef3f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #dfe6ef;border-radius:20px;padding:28px;box-shadow:0 18px 55px rgba(25,48,77,.12)}h1{margin:0 0 8px;color:#10233f}.muted{color:#64748b;line-height:1.5}form{display:grid;gap:14px;margin-top:22px}label{font-weight:700;font-size:.92rem}input{width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:11px;padding:12px;font:inherit}.btn{border:0;border-radius:11px;padding:12px 15px;background:#18508f;color:#fff;font-weight:800;cursor:pointer}.notice{margin-top:16px;padding:12px 14px;border-radius:11px;background:#eef6ff;color:#23466f}.error{background:#fff1f2;color:#9f1239}.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.links a{color:#18508f;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <h1>Acceso al LMS</h1>
  <p class="muted">Puedes entrar directamente con las credenciales locales del LMS. El acceso desde CAMPUS continúa funcionando de forma independiente.</p>
  <form id="loginForm">
    <label>Usuario o correo
      <input name="login" autocomplete="username" required autofocus>
    </label>
    <label>Contraseña
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn">Entrar</button>
  </form>
  <div id="message" aria-live="polite"></div>
  <div class="links">
    <a href="/">Volver al inicio</a>
    <span class="muted">Primera activación: entra una vez desde CAMPUS y configura tu acceso local.</span>
  </div>
</main>
<script>
document.querySelector("#loginForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const form=e.currentTarget,button=form.querySelector("button"),message=document.querySelector("#message");
  button.disabled=true;button.textContent="Entrando…";message.innerHTML="";
  try{
    const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:form.login.value,password:form.password.value}),credentials:"include"});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||"No se pudo iniciar sesión");
    location.href=(d.role==="teacher"||d.role==="admin")?"/teacher.html":"/";
  }catch(err){
    message.innerHTML="<div class='notice error'>"+escapeHtml(err.message)+"</div>";
    button.disabled=false;button.textContent="Entrar";
  }
});
function escapeHtml(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
</script>
</body>
</html>
