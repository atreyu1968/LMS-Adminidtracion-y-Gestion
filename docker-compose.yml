services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LMS_DATABASE_URL: ${LMS_DATABASE_URL:-postgresql+psycopg://lms:lms@db:5432/lms}
      LMS_PUBLIC_BASE_URL: ${LMS_PUBLIC_BASE_URL:-http://localhost:8080}
      LMS_STORAGE_ROOT: /data
      LMS_LTI_PRIVATE_KEY_PATH: /data/keys/lti-private.pem
    volumes:
      - lms-data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - lms-data:/srv/lms-data:ro
    depends_on:
      - api

volumes:
  postgres-data:
  lms-data:
