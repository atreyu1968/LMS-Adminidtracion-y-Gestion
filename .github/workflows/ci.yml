name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q app
      - name: Validate release version
        run: |
          EXPECTED="$(tr -d '[:space:]' < ../VERSION)"
          ACTUAL="$(python -c 'from app.version import __version__; print(__version__)')"
          test "$EXPECTED" = "$ACTUAL"
      - name: Validate deployment scripts
        working-directory: ${{ github.workspace }}
        run: |
          bash -n scripts/install-ubuntu.sh
          bash -n scripts/bootstrap-ubuntu.sh
          bash -n scripts/verify-installation.sh
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
          bash -n scripts/update-ubuntu.sh
          bash -n scripts/create-admin.sh
          cp .env.example .env
          docker compose config >/dev/null
      - name: Validate frontends
        working-directory: ${{ github.workspace }}
        run: node scripts/validate-frontends.mjs
      - name: Test
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Package NOMINASOL 2026.13 SCORM
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OUT="dist/NOMINASOL_2026_Educativa_SCORM_1.2_v2026.13.zip"
          WORK="dist/nominasol-scorm"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK"
          cp modules/nominasol2026/scorm/master/imsmanifest.xml "$WORK/imsmanifest.xml"
          cp modules/nominasol2026/scorm/master/index.html "$WORK/index.html"
          cp modules/nominasol2026/scorm/master/standalone-data.js "$WORK/standalone-data.js"
          printf '%s\n' '{"project":"nominasol2026","version":"2026.13","commit":"'${GITHUB_SHA}'"}' > "$WORK/guided-version.json"
          (
            cd "$WORK"
            zip -q -r "../$(basename "$OUT")" .
          )
          unzip -l "$OUT"
          unzip -p "$OUT" imsmanifest.xml | grep -q '<schemaversion>1.2</schemaversion>'
          unzip -p "$OUT" imsmanifest.xml | grep -q 'standalone-data.js'
          unzip -p "$OUT" index.html | grep -q 'makeLocalRuntime'
          unzip -p "$OUT" index.html | grep -q 'https://www.sdelsol.com/paraninfo/'
          unzip -p "$OUT" standalone-data.js | grep -q 'NOMINASOL_STANDALONE_DATA'
      - name: Upload NOMINASOL SCORM artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOMINASOL_2026_Educativa_SCORM_1.2_v2026.13
          path: dist/NOMINASOL_2026_Educativa_SCORM_1.2_v2026.13.zip
          if-no-files-found: error
          retention-days: 30


  stack-smoke:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production-like environment
        run: |
          SESSION_SECRET="$(openssl rand -hex 32)"
          ADMIN_TOKEN="$(openssl rand -hex 32)"
          AI_SECRET="$(openssl rand -hex 32)"
          DB_PASSWORD="$(openssl rand -hex 32)"
          cat > .env <<EOF
          LMS_DATABASE_URL=postgresql+psycopg://lms:${DB_PASSWORD}@db:5432/lms
          LMS_PUBLIC_BASE_URL=https://lms-ci.example.test
          LMS_AI_ENCRYPTION_SECRET=${AI_SECRET}
          LMS_SESSION_SECRET=${SESSION_SECRET}
          LMS_ADMIN_TOKEN=${ADMIN_TOKEN}
          LMS_LTI_PRIVATE_KEY_PATH=/data/keys/lti-private.pem
          LMS_MODULES_ROOT=/modules
          LMS_STORAGE_ROOT=/data
          LMS_SCORM_CONTENT_BASE_URL=https://lms-ci.example.test/scorm-content
          LMS_MAX_SCORM_UPLOAD_MB=512
          LMS_MAX_MEDIA_UPLOAD_MB=2048
          LMS_MAX_EVIDENCE_UPLOAD_MB=256
          LMS_CORS_ORIGINS=https://lms-ci.example.test
          POSTGRES_DB=lms
          POSTGRES_USER=lms
          POSTGRES_PASSWORD=${DB_PASSWORD}
          EOF
          chmod 600 .env
      - name: Build and start full stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200 api web db
          exit 1
      - name: Verify running installation
        run: bash scripts/verify-installation.sh
      - name: Exercise backup and restore
        run: |
          sudo bash scripts/backup.sh /tmp/lms-ci-backup
          sudo test -s /tmp/lms-ci-backup/database.sql.gz
          sudo test -s /tmp/lms-ci-backup/storage.tar.gz
          sudo test -s /tmp/lms-ci-backup/SHA256SUMS
          sudo bash scripts/restore.sh /tmp/lms-ci-backup --yes
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'
      - name: Final diagnostics
        run: |
          set -a
          source .env
          set +a
          curl -fsS -H "X-Admin-Token: ${LMS_ADMIN_TOKEN}"             http://127.0.0.1:8080/api/admin/readiness | tee /tmp/readiness.json
          grep -q '"code_ready":true' /tmp/readiness.json
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=250 api web db || true
      - name: Stop stack
        if: always()
        run: docker compose down -v || true
